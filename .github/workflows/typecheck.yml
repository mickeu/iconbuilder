name: typecheck
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Private repository ref"
        required: false
        default: phase4
jobs:
  typecheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mickeu/spotify-plugin-build
          ref: ${{ inputs.ref || 'phase4' }}
          token: ${{ secrets.SRC_TOKEN }}
      - name: swiftc -typecheck
        run: |
          set -euo pipefail
          set -x
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TARGET=$(sed -n 's/.*-target \(arm64-apple-ios[0-9.]*\).*/\1/p' scripts/build-widget-extension.sh | head -1)
            TARGET=${TARGET:-arm64-apple-ios26.0}
            echo "typechecking for $TARGET"
            swiftc -typecheck -target "$TARGET" -sdk "$SDK" \
            -module-name WidgetExtension \
            extension/WidgetExtension/*.swift \
            tweak/Sources/Shared/LiveActivity/LyricsActivityState.swift \
            tweak/Sources/Shared/LiveActivity/LiveActivityShared.swift \
            tweak/Sources/Shared/LiveActivity/DynamicLyricsHost.swift \
            2>&1 | tee typecheck.log
          exit ${PIPESTATUS[0]}
      - name: Report typecheck errors
        if: failure()
        run: |
          if [ -f typecheck.log ]; then
            while IFS= read -r line; do echo "::error::$line"; done < <(head -n 80 typecheck.log)
          fi
