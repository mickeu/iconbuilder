name: probe12

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mickeu/spotify-plugin-build
          ref: phase4
          token: ${{ secrets.SRC_TOKEN }}
          path: src

      - name: Build the dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.2 \
            -sdk "$SDK" \
            -emit-library -o out/sg12probe.dylib \
            -framework Foundation -framework UIKit -framework ActivityKit \
            src/tweak/Sources/Shared/LiveActivity/SG12Probe.swift \
            src/tweak/Sources/Shared/LiveActivity/SG12Bootstrap.m
          ldid -S out/sg12probe.dylib || true
          ls -l out
          shasum -a 256 out/sg12probe.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: probe12
          path: out/
